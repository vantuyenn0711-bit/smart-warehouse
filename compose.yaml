name: smart-warehouse
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run scripts/init_env.py first}
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/init_env.py first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py first}
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: "no"
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
    ports:
      - "127.0.0.1:${APP_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  warehouse_data:
