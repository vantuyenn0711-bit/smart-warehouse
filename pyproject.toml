[project]
name = "smart-warehouse"
version = "0.1.0"
description = "Vietnamese inventory management with auditable PostgreSQL transactions"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "psycopg[binary]>=3.2,<4",
  "dj-database-url>=2.3,<4",
  "python-dotenv>=1.0,<2",
  "openpyxl>=3.1,<4",
  "whitenoise>=6.8,<7",
  "gunicorn>=23,<26; sys_platform != 'win32'",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.9,<5", "ruff>=0.11,<1", "playwright>=1.50,<2"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".runtime", "static/vendor", "*/migrations/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
