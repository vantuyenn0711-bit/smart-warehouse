<div class="form-field {% if field.errors %}has-error{% endif %} {% if field.field.widget.input_type == 'checkbox' %}checkbox-field{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}<label class="checkbox-label">{{ field }} <span>{{ field.label }}</span></label>{% else %}<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required" aria-label="bắt buộc"> *</span>{% endif %}</label>{{ field }}{% endif %}
  {% if field.help_text %}<small class="field-help" id="{{ field.id_for_label }}_helptext">{{ field.help_text|safe }}</small>{% endif %}
  {% for error in field.errors %}<span class="field-error" role="alert">{{ error }}</span>{% endfor %}
</div>
